name: Java CI with Gradle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build User Service
        working-directory: ./UserService
        run: |
          chmod +x gradlew
          ./gradlew check

      - name: Build Task Service
        working-directory: ./TaskService
        run: |
          chmod +x gradlew
          ./gradlew check

      - name: Generate coverage badge (User Service)
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: UserService/build/reports/jacoco/test/jacocoTestReport.csv
          badges-directory: badges
          coverage-badge-filename: jacoco-user-service.svg
          coverage-label: User Service Coverage

      - name: Generate coverage badge (Task Service)
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: TaskService/build/reports/jacoco/test/jacocoTestReport.csv
          badges-directory: badges
          coverage-badge-filename: jacoco-task-service.svg
          coverage-label: Task Service Coverage

      - name: Commit updated badges
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update coverage badges [skip ci]"
          file_pattern: badges/*.svg