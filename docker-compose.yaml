services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build: ./UserService
    environment:
      URL_POSTGRES: jdbc:postgresql://postgres:5432/userdb
      USERNAME_POSTGRES: ${DB_USER}
      PASSWORD_POSTGRES: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: "3600000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  task-service:
    build: ./TaskService
    environment:
      URL_POSTGRES: jdbc:postgresql://postgres:5432/taskdb
      USERNAME_POSTGRES: ${DB_USER}
      PASSWORD_POSTGRES: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

volumes:
  postgres_data: